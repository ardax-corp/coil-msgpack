name: CI

# Every pull request, and every push to master (including merges).
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: coil test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout package
        uses: actions/checkout@v4

      # coil comes from the coil-lang `edge` release (a snapshot of its main,
      # rebuilt after every green coil-lang CI run) instead of a source build.
      - name: Install coil (edge)
        uses: ardax-corp/coil-lang/.github/actions/setup-coil@main

      - name: Language harness (`coil test`)
        run: coil test
