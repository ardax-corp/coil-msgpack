name: CI

# Every pull request, and every push to master (including merges).
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: coil test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout package
        uses: actions/checkout@v4

      - name: Checkout coil-lang
        uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-lang
          path: coil-lang

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: coil-lang

      - name: Build coil
        working-directory: coil-lang
        run: cargo build --bin coil

      - name: Test package
        run: ./coil-lang/target/debug/coil test
