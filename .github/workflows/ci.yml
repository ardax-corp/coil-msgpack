name: CI

# Every pull request into master, and every push to master (including merges).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# A new push to a pull request cancels that PR's older runs. Runs on the
# default branch are never cancelled once started.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: coil test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout package
        uses: actions/checkout@v4

      # coil comes from the coil-lang `edge` release (a snapshot of its main,
      # rebuilt after every green coil-lang CI run) instead of a source build.
      - name: Install coil (edge)
        id: coil
        uses: ardax-corp/coil-lang/.github/actions/setup-coil@main
        with:
          stdlib: true

      - name: Language harness (`coil test`)
        run: coil test --root "${{ steps.coil.outputs.stdlib }}"
